[project]
name = "find-planet-openorb"
version = "1.0.0"
description = "Identity-neutral orbit determination for anonymous MMTO directions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy==7.2.0",
    "matplotlib==3.11.1",
    "numpy==2.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["find_planet_openorb"]
