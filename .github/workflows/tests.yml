name: Solver regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        solver: [".", "v4", "v5"]
    defaults:
      run:
        working-directory: ${{ matrix.solver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.30"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Synthetic and unit checks
        run: uv run --frozen python -m unittest discover -v
      - name: Fresh pixel-to-sky solution (offline)
        run: ./demo.sh
  v24-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.30"
          python-version: "3.12"
      - run: uv sync --project v24 --frozen
      - name: V24 visible-sky calibration checks
        run: >-
          cd v24 && uv run --frozen python -m unittest -v
          test_visible_sky_mask_builder test_visible_sky_calibration
          test_visible_sky_registry test_point_star_visible_sky
          test_visible_sky_mask_integration test_visible_sky_launcher_resolution
          test_visible_sky_cold_start
      - name: V24 assignment-aware downloader checks
        run: >-
          env PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/v24"
          uv run --project v24 --frozen python -m unittest -v
          tests.test_allsky_manifest tests.test_allsky_cli
      - name: Fresh v24 pixel-to-sky solution (offline)
        run: ./v24/demo.sh --output v24/results/ci-visible-sky
  v25-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.30"
          python-version: "3.12"
      - run: uv sync --project v25 --frozen
      - name: V25 operator and calibration checks
        run: >-
          cd v25 && uv run --frozen python -m unittest -v
          test_visible_sky_operator test_visible_sky_auto_workflow
          test_visible_sky_automatic test_visible_sky_calibration
          test_visible_sky_registry test_visible_sky_cold_start
      - name: V24 freeze and v25 boundary checks
        run: uv run --frozen python -m unittest -v test_v25_runtime_boundary
      - name: Fresh v25 pixel-to-sky solution (offline)
        run: ./v25/demo.sh --output v25/results/ci-visible-sky
  v25-clean-clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Clean clone to verified v25 report
        env:
          CLEAN_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$CLEAN_IMAGE" \
            bash -ceu '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash ca-certificates coreutils curl git tar
              ./quickstart.sh
              test -f results/quickstart-v25/report.pdf
              ./quickstart.sh
              test -f results/quickstart-v25/report.pdf
            '
