name: Solver regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        solver: [".", "v4", "v5"]
    defaults:
      run:
        working-directory: ${{ matrix.solver }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.30"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Synthetic and unit checks
        run: uv run --frozen python -m unittest discover -v
      - name: Fresh pixel-to-sky solution (offline)
        run: ./demo.sh
  v24-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.30"
          python-version: "3.12"
      - run: uv sync --project v24 --frozen
      - name: V24 visible-sky calibration checks
        run: >-
          cd v24 && uv run --frozen python -m unittest -v
          test_visible_sky_mask_builder test_visible_sky_calibration
          test_visible_sky_registry test_point_star_visible_sky
          test_visible_sky_mask_integration test_visible_sky_launcher_resolution
          test_visible_sky_cold_start
      - name: V24 assignment-aware downloader checks
        run: >-
          env PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/v24"
          uv run --project v24 --frozen python -m unittest -v
          tests.test_allsky_manifest tests.test_allsky_cli
      - name: Fresh v24 pixel-to-sky solution (offline)
        run: ./v24/demo.sh --output v24/results/ci-visible-sky
